<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pesée" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <clipPath id="capClip"><rect x="106" y="130" width="300" height="58" rx="29"/></clipPath>
  </defs>

  <!-- fond badge -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- suspentes -->
    <line x1="140" y1="188" x2="140" y2="250"/>
    <line x1="372" y1="188" x2="372" y2="250"/>
    <!-- plateaux (coupelles) -->
    <path d="M78 250 Q140 312 202 250"/>
    <path d="M310 250 Q372 312 434 250"/>
    <!-- pied -->
    <line x1="182" y1="392" x2="330" y2="392"/>
  </g>

  <!-- mât central -->
  <rect x="243" y="176" width="26" height="206" rx="13" fill="#fff"/>

  <!-- fléau = gélule bicolore -->
  <rect x="106" y="130" width="300" height="58" rx="29" fill="#fff"/>
  <rect x="256" y="130" width="150" height="58" fill="#c7d2fe" clip-path="url(#capClip)"/>
  <rect x="252" y="130" width="8" height="58" fill="#4338ca" opacity="0.35"/>
</svg>
